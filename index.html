<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Samvidha • IARE Student Portal</title>
  
  <meta name="title" content="Samvidha IARE • Student Companion">
  <meta name="description" content="Open events, attendance, timetable, and campus updates in the official Samvidha App for IARE.">
  <meta name="theme-color" content="#090d16">
  <link rel="icon" href="logo.png" type="image/png">

  <!-- Fonts & QR Lib -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>
  <div class="glow-sphere glow-3"></div>

  <div class="wrapper">
    <main class="card">
      <!-- App Icon with glowing badge -->
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <img src="logo.png" alt="Samvidha App Logo" class="app-logo">
      </div>

      <!-- App Title -->
      <div class="header-text">
        <div class="badge">
          <span class="pulse-dot"></span>
          IARE OFFICIAL
        </div>
        <h1 class="title">Samvidha</h1>
        <p class="subtitle">Institute of Aeronautical Engineering</p>
      </div>

      <!-- Auto Redirect Status Banner -->
      <div class="redirect-box" id="redirect-box">
        <div class="loader-ring"></div>
        <span id="redirect-status">Opening in Samvidha App...</span>
      </div>

      <!-- Main Action Buttons -->
      <div class="actions">
        <!-- Direct App Deep Link -->
        <a href="#" id="open-app-btn" class="btn btn-primary">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Open in App</span>
        </a>

        <!-- Official Google Play Store Button -->
        <a href="https://play.google.com/store/apps/details?id=com.zyratech.samvidha" target="_blank" rel="noopener" class="btn btn-playstore">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.609 1.814L13.793 12 3.61 22.186c-.378-.403-.61-.97-.61-1.614V3.428c0-.644.232-1.211.609-1.614zm11.246 11.246l2.365 2.365-12.062 6.942 9.697-9.307zm0-2.12L5.158 1.633l12.062 6.942-2.365 2.365zm1.096 1.06l3.527-2.029a1.503 1.503 0 010 2.603l-3.527 2.03-1.096-1.06 1.096-1.544z"/>
          </svg>
          <div class="btn-text">
            <span class="sub">GET IT ON</span>
            <span class="main">Google Play</span>
          </div>
        </a>
      </div>

      <!-- Quick QR Code section (visible on PC / Desktop) -->
      <div class="qr-section" id="qr-section">
        <div class="qr-card">
          <div id="qrcode"></div>
        </div>
        <p class="qr-desc">Scan with phone camera to open in app</p>
      </div>

      <!-- Footer Info -->
      <footer class="footer">
        <p>Smart Student Hub • Attendance, Marks, Timetable & Events</p>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
